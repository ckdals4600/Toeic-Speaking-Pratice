<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="토익스피킹 만능문장을 한글 뜻만 보고 영어로 말해보는 스피킹 암기 카드. 틀린 문장이 더 자주 나오고, 정답은 원어민 발음으로 들을 수 있습니다.">
<meta name="theme-color" content="#ECEFEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1513" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="토스 카드">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=&apos;http://www.w3.org/2000/svg&apos; viewBox=&apos;0 0 100 100&apos;%3E%3Crect width=&apos;100&apos; height=&apos;100&apos; rx=&apos;22&apos; fill=&apos;%230E6E62&apos;/%3E%3Ctext x=&apos;50&apos; y=&apos;68&apos; font-size=&apos;52&apos; font-family=&apos;ui-monospace,monospace&apos; font-weight=&apos;600&apos; fill=&apos;white&apos; text-anchor=&apos;middle&apos;%3ETS%3C/text%3E%3C/svg%3E">
<title>토스 스피킹 카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap" rel="stylesheet">

<style>
:root{
  color-scheme: light;
  --paper:#ECEFEA;
  --surface:#FFFFFF;
  --surface-2:#F4F7F2;
  --ink:#16201D;
  --ink-soft:#3C4A45;
  --muted:#5F6E68;
  --line:#D7DED7;
  --line-soft:#E4E9E2;
  --accent:#0E6E62;
  --accent-ink:#FFFFFF;
  --accent-soft:#DCEAE6;
  --ember:#B84A1C;
  --ember-ink:#FFFFFF;
  --ember-soft:#F6E3D9;
  --shadow:0 1px 2px rgba(22,32,29,.05), 0 10px 28px -14px rgba(22,32,29,.22);
  --radius:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#0E1513;
    --surface:#18211E;
    --surface-2:#1E2825;
    --ink:#E4E9E4;
    --ink-soft:#B6C2BD;
    --muted:#8A9994;
    --line:#2B3733;
    --line-soft:#232E2B;
    --accent:#45B8A3;
    --accent-ink:#06201C;
    --accent-soft:#123832;
    --ember:#E5895E;
    --ember-ink:#2A1206;
    --ember-soft:#3A2318;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#0E1513;
  --surface:#18211E;
  --surface-2:#1E2825;
  --ink:#E4E9E4;
  --ink-soft:#B6C2BD;
  --muted:#8A9994;
  --line:#2B3733;
  --line-soft:#232E2B;
  --accent:#45B8A3;
  --accent-ink:#06201C;
  --accent-soft:#123832;
  --ember:#E5895E;
  --ember-ink:#2A1206;
  --ember-soft:#3A2318;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.7);
}

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"IBM Plex Sans KR", system-ui, -apple-system, "Malgun Gothic", sans-serif;
  -webkit-text-size-adjust:100%;
  overflow:hidden;
}
button{ font:inherit; color:inherit; }

.app{
  height:100dvh;
  max-width:34rem;
  margin:0 auto;
  padding:0 clamp(.9rem,4vw,1.4rem);
  display:flex;
  flex-direction:column;
  gap:.7rem;
}

/* ---------- top rail ---------- */
.rail{
  display:flex; align-items:center; gap:.6rem;
  padding:.85rem 0 .1rem;
}
.mark{
  font-family:"IBM Plex Mono", ui-monospace, monospace;
  font-size:.68rem; font-weight:600; letter-spacing:.12em;
  color:var(--accent-ink); background:var(--accent);
  padding:.3rem .45rem; border-radius:7px;
}
.rail h1{
  margin:0; font-size:.95rem; font-weight:600; letter-spacing:-.01em;
  flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.counter{
  font-family:"IBM Plex Mono", ui-monospace, monospace;
  font-size:.72rem; color:var(--muted); font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.counter b{ color:var(--ink); font-weight:600; }
.icon-btn{
  width:2.05rem; height:2.05rem; flex:none;
  display:grid; place-items:center;
  background:var(--surface); border:1px solid var(--line);
  border-radius:9px; cursor:pointer; color:var(--ink-soft);
  transition:border-color .15s, color .15s;
}
.icon-btn:hover{ color:var(--ink); border-color:var(--muted); }
.icon-btn svg{ width:16px; height:16px; }

/* ---------- deck chips ---------- */
.decks{
  display:flex; gap:.35rem; overflow-x:auto; padding-bottom:.15rem;
  scrollbar-width:none; -ms-overflow-style:none;
}
.decks::-webkit-scrollbar{ display:none; }
.chip{
  flex:none; cursor:pointer;
  padding:.4rem .7rem; border-radius:999px;
  border:1px solid var(--line); background:var(--surface);
  font-size:.78rem; font-weight:500; color:var(--ink-soft);
  white-space:nowrap; transition:background .15s, color .15s, border-color .15s;
}
.chip:hover{ border-color:var(--muted); }
.chip[aria-pressed="true"]{
  background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600;
}
.chip .n{
  font-family:"IBM Plex Mono", ui-monospace, monospace;
  font-size:.68rem; opacity:.62; margin-left:.28rem; font-variant-numeric:tabular-nums;
}

/* ---------- mastery bar ---------- */
.mastery{
  display:flex; align-items:center; gap:.55rem;
  font-family:"IBM Plex Mono", ui-monospace, monospace;
  font-size:.66rem; color:var(--muted); font-variant-numeric:tabular-nums;
}
.mastery .track{
  flex:1; height:3px; border-radius:2px; background:var(--line-soft); overflow:hidden;
}
.mastery .fill{
  height:100%; width:0%; background:var(--accent);
  transition:width .45s cubic-bezier(.22,.7,.3,1);
}

/* ---------- card ---------- */
.stage{ flex:1; min-height:0; display:flex; }
.card{
  flex:1; position:relative;
  display:flex; flex-direction:column;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:1.15rem 1.25rem 1.25rem 1.5rem;
  cursor:pointer; overflow:hidden;
  transition:border-color .15s;
}
.card:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
/* mastery rail — ::before is the empty track, ::after the fill on top of it.
   Fill height encodes this card's level (0–5), so the rail reports progress. */
.card::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:var(--line-soft);
}
.card::after{
  content:""; position:absolute; left:0; bottom:0; width:3px;
  height:var(--lvl, 0%); background:var(--accent); opacity:.85;
  transition:height .4s cubic-bezier(.22,.7,.3,1);
}

.tag{
  font-family:"IBM Plex Mono", ui-monospace, monospace;
  font-size:.64rem; font-weight:500; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); display:flex; align-items:center; gap:.5rem;
}
.tag .dot{ width:4px; height:4px; border-radius:50%; background:var(--muted); }
.tag .lvl{ color:var(--accent); }

.body{
  flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center;
  gap:1rem; padding:.6rem 0; overflow-y:auto;
}
.ko{
  font-size:clamp(1.35rem, 5.6vw, 1.9rem);
  font-weight:600; line-height:1.45; letter-spacing:-.02em;
  text-wrap:balance; margin:0;
  transition:font-size .3s cubic-bezier(.22,.7,.3,1), color .3s;
}
.card.is-open .ko{
  font-size:.92rem; font-weight:500; color:var(--muted); letter-spacing:0;
}
.answer{ display:none; flex-direction:column; gap:.85rem; }
.card.is-open .answer{ display:flex; animation:rise .32s cubic-bezier(.22,.7,.3,1) both; }
@keyframes rise{ from{ opacity:0; transform:translateY(9px); } to{ opacity:1; transform:none; } }
.en{
  font-family:"Literata", Georgia, "Times New Roman", serif;
  font-size:clamp(1.3rem, 5.1vw, 1.75rem);
  font-weight:500; line-height:1.5; letter-spacing:-.008em;
  margin:0; text-wrap:pretty;
}
.note{
  font-size:.8rem; line-height:1.6; color:var(--ink-soft);
  background:var(--surface-2); border-left:2px solid var(--accent);
  padding:.55rem .7rem; border-radius:0 8px 8px 0; margin:0;
}

/* audio row */
.audio{ display:flex; align-items:center; gap:.45rem; flex-wrap:wrap; }
.play{
  display:inline-flex; align-items:center; gap:.45rem; cursor:pointer;
  padding:.5rem .85rem .5rem .7rem; border-radius:999px;
  background:var(--accent-soft); border:1px solid transparent; color:var(--accent);
  font-size:.82rem; font-weight:600;
  transition:filter .15s;
}
.play:hover{ filter:brightness(.96); }
.play svg{ width:15px; height:15px; }
.play.is-speaking{ border-color:var(--accent); }
.rate{ display:flex; gap:2px; background:var(--surface-2); border-radius:999px; padding:2px; }
.rate button{
  cursor:pointer; border:0; background:transparent; color:var(--muted);
  font-family:"IBM Plex Mono", ui-monospace, monospace;
  font-size:.7rem; font-weight:500; padding:.32rem .5rem; border-radius:999px;
  font-variant-numeric:tabular-nums;
}
.rate button[aria-pressed="true"]{ background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }

.hint{
  position:absolute; left:0; right:0; bottom:.85rem;
  text-align:center; font-size:.72rem; color:var(--muted);
  pointer-events:none; transition:opacity .2s;
}
.card.is-open .hint{ opacity:0; }

/* ---------- action row ---------- */
.actions{ display:grid; grid-template-columns:1fr 1fr; gap:.5rem; padding-bottom:max(.9rem, env(safe-area-inset-bottom)); }
.act{
  cursor:pointer; border-radius:14px; border:1px solid var(--line);
  background:var(--surface); padding:.95rem .5rem;
  display:flex; flex-direction:column; align-items:center; gap:.12rem;
  transition:transform .1s, background .15s, border-color .15s, color .15s;
}
.act:active{ transform:scale(.985); }
.act strong{ font-size:.95rem; font-weight:600; }
.act span{
  font-family:"IBM Plex Mono", ui-monospace, monospace;
  font-size:.62rem; letter-spacing:.06em; color:var(--muted);
}
.act.again:hover{ background:var(--ember-soft); border-color:var(--ember); color:var(--ember); }
.act.got:hover{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
.act:disabled{ opacity:.4; cursor:default; }
.act:disabled:hover{ background:var(--surface); border-color:var(--line); color:var(--ink); }

/* ---------- settings sheet ---------- */
.scrim{
  position:fixed; inset:0; background:rgba(10,16,14,.42);
  display:none; align-items:flex-end; justify-content:center; z-index:20;
  padding:1rem;
}
.scrim.is-open{ display:flex; }
.sheet{
  width:100%; max-width:34rem; background:var(--surface);
  border:1px solid var(--line); border-radius:20px; padding:1.15rem;
  box-shadow:var(--shadow); display:flex; flex-direction:column; gap:.15rem;
  animation:sheetUp .26s cubic-bezier(.22,.7,.3,1) both;
}
@keyframes sheetUp{ from{ transform:translateY(14px); opacity:0; } to{ transform:none; opacity:1; } }
.sheet h2{ margin:0 0 .5rem; font-size:.95rem; font-weight:600; }
.row{
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
  padding:.7rem 0; border-top:1px solid var(--line-soft);
}
.row:first-of-type{ border-top:0; }
.row .label{ font-size:.85rem; }
.row .sub{ display:block; font-size:.72rem; color:var(--muted); margin-top:.15rem; line-height:1.5; }
.toggle{
  position:relative; width:44px; height:25px; flex:none; cursor:pointer;
  border-radius:999px; border:1px solid var(--line); background:var(--surface-2);
  transition:background .18s, border-color .18s;
}
.toggle::after{
  content:""; position:absolute; top:2px; left:2px; width:19px; height:19px;
  border-radius:50%; background:var(--muted); transition:transform .18s, background .18s;
}
.toggle[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); }
.toggle[aria-pressed="true"]::after{ transform:translateX(19px); background:var(--accent-ink); }
.danger{
  margin-top:.75rem; cursor:pointer; width:100%;
  padding:.7rem; border-radius:11px; border:1px solid var(--line);
  background:transparent; color:var(--ember); font-size:.83rem; font-weight:600;
}
.danger:hover{ background:var(--ember-soft); border-color:var(--ember); }
.close{
  margin-top:.4rem; cursor:pointer; width:100%;
  padding:.75rem; border-radius:11px; border:0;
  background:var(--accent); color:var(--accent-ink); font-size:.88rem; font-weight:600;
}

.toast{
  position:fixed; left:50%; bottom:5.5rem; transform:translate(-50%, 10px);
  background:var(--ink); color:var(--paper); font-size:.8rem;
  padding:.55rem .9rem; border-radius:999px; opacity:0; pointer-events:none;
  transition:opacity .2s, transform .2s; z-index:30; max-width:90vw; text-align:center;
}
.toast.is-on{ opacity:1; transform:translate(-50%, 0); }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
}
@media (min-width:600px){
  .hint::after{ content:"  ·  스페이스로 확인, 1 다시 / 2 알았어"; }
}
</style>
</head>
<body>
<div class="app">
  <div class="rail">
    <span class="mark">TS</span>
    <h1>토스 스피킹 카드</h1>
    <span class="counter" id="counter">0장 · 정답률 —</span>
    <button class="icon-btn" id="openSettings" aria-label="설정 열기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>

  <nav class="decks" id="decks" aria-label="덱 선택"></nav>

  <div class="mastery">
    <span id="masteryLabel">숙달 0%</span>
    <span class="track"><span class="fill" id="masteryFill"></span></span>
    <span id="masteryCount">0/0</span>
  </div>

  <div class="stage">
    <article class="card" id="card" role="button" tabindex="0" aria-label="탭하면 정답이 보입니다">
      <div class="tag" id="tag"></div>
      <div class="body">
        <p class="ko" id="ko">불러오는 중…</p>
        <div class="answer">
          <p class="en" id="en"></p>
          <div class="audio">
            <button class="play" id="play" aria-label="영어 문장 발음 듣기">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
              발음 듣기
            </button>
            <div class="rate" id="rate" role="group" aria-label="재생 속도">
              <button data-rate="0.7" aria-pressed="false">0.7x</button>
              <button data-rate="0.85" aria-pressed="true">0.85x</button>
              <button data-rate="1" aria-pressed="false">1.0x</button>
            </div>
          </div>
          <p class="note" id="note" hidden></p>
        </div>
      </div>
      <div class="hint">탭해서 정답 확인</div>
    </article>
  </div>

  <div class="actions">
    <button class="act again" id="btnAgain" disabled><strong>다시</strong><span>AGAIN</span></button>
    <button class="act got" id="btnGot" disabled><strong>알았어</strong><span>GOT IT</span></button>
  </div>
</div>

<div class="scrim" id="scrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="설정">
    <h2>설정</h2>
    <div class="row">
      <span class="label">정답 자동 재생
        <span class="sub">카드를 열면 바로 발음이 나옵니다.</span>
      </span>
      <button class="toggle" id="tAuto" aria-pressed="false" aria-label="정답 자동 재생"></button>
    </div>
    <div class="row">
      <span class="label">틀린 문장 더 자주 보기
        <span class="sub">끄면 완전 무작위. 켜면 틀린 카드가 약 3배 자주 나오되, 모든 카드가 계속 등장합니다.</span>
      </span>
      <button class="toggle" id="tWeight" aria-pressed="true" aria-label="틀린 문장 가중치"></button>
    </div>
    <div class="row">
      <span class="label">한글 뜻 먼저 보기
        <span class="sub">끄면 영어를 먼저 보고 한글 뜻을 맞추는 역방향 모드가 됩니다.</span>
      </span>
      <button class="toggle" id="tDir" aria-pressed="true" aria-label="출제 방향"></button>
    </div>
    <button class="danger" id="btnReset">학습 기록 초기화</button>
    <button class="close" id="btnClose">닫기</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ------------------------------------------------------------------
   DATA — [category, korean, english, note?]
------------------------------------------------------------------ */
const DECKS = [
  { id:"all",    name:"전체" },
  { id:"myadd",  name:"추가 단어" },
  { id:"mine",   name:"내 교정노트" },
  { id:"pron",   name:"발음 주의" },
  { id:"p2",     name:"Part 2 사진묘사" },
  { id:"p3",     name:"Part 3 질문답변" },
  { id:"p4",     name:"Part 4 정보전달" },
  { id:"p5",     name:"Part 5 의견말하기" },
  { id:"core",   name:"만능 연결어" },
  { id:"adj",    name:"형용사" },
  { id:"adv",    name:"부사" },
  { id:"work",   name:"직장" },
  { id:"school", name:"학교" },
  { id:"tech",   name:"기술" },
  { id:"shop",   name:"쇼핑" },
  { id:"house",  name:"주거" },
  { id:"trend",  name:"트렌드" },
  { id:"travel", name:"여행" },
  { id:"env",    name:"환경" }
];

const DATA = [
/* ---------- Part 2 : 사진 묘사 ---------- */
["p2","이 사진은 회의실에서 찍힌 것 같습니다.","I think this picture was taken in a meeting room."],
["p2","이 사진은 실내에서 찍힌 것 같습니다.","I think this picture was taken indoors.","장소 단어가 안 떠오를 때 쓰는 안전장치."],
["p2","이 사진은 야외에서 찍힌 것 같습니다.","I think this picture was taken outdoors."],
["p2","이 사진은 창고에서 찍힌 것 같습니다.","I think this picture was taken in a warehouse.","물건을 보관·운반하는 곳은 warehouse, 만드는 곳이 factory."],
["p2","이 사진은 식료품점에서 찍힌 것 같습니다.","I think this picture was taken at a grocery store."],

["env","학교가 환경 문제에 대한 인식을 높일 수 있습니다.","Schools can raise awareness of environmental issues.","raise awareness of A = A에 대한 인식을 높이다."],
["env","저는 일회용품 사용을 줄이려고 합니다.","I try to use fewer disposable products.","disposable products = 일회용품."],
["env","작은 습관이 환경을 보호할 수 있습니다.","Small habits can protect the environment.","protect the environment = 환경을 보호하다."],
["env","저는 남은 음식을 줄여서 쓰레기를 줄입니다.","I reduce waste by throwing away less food.","reduce waste = 쓰레기를 줄이다."],
["env","미세먼지가 심각한 문제가 되었습니다.","Fine dust has become a serious issue.","become a serious issue = 심각한 문제가 되다."],
["env","그 강은 공장 때문에 오염되었습니다.","The river was polluted by the factories.","be polluted = 오염되다."],
["env","많은 사람들이 그 문제의 심각성을 모릅니다.","Many people don't realize the seriousness of the problem.","seriousness = 심각성."],
["env","우리는 공원을 깨끗하게 유지해야 합니다.","We should keep the park clean.","keep A clean = A를 깨끗하게 유지하다."]
];

/* ------------------------------------------------------------------
   STATE
------------------------------------------------------------------ */
const KEY = "toeic-speaking-cards-v1";
const CARDS = DATA.map(([cat, ko, en, note]) => ({ cat, ko, en, note: note || "" }));
const DECK_NAME = Object.fromEntries(DECKS.map(d => [d.id, d.name]));

const defaults = {
  deck: "all",
  autoPlay: false,
  weighted: true,
  koFirst: true,
  rate: 0.85,
  progress: {}          // en -> { lvl, r, w }
};
let state = load();
let session = { seen: 0, right: 0 };
let current = null;
let recent = [];
let revealed = false;

function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return { ...defaults, progress: {} };
    const saved = JSON.parse(raw);
    return { ...defaults, ...saved, progress: saved.progress || {} };
  } catch { return { ...defaults, progress: {} }; }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
}
function rec(card){
  return state.progress[card.en] || { lvl: 0, r: 0, w: 0 };
}

/* ------------------------------------------------------------------
   DECK + WEIGHTED PICK
------------------------------------------------------------------ */
// 같은 영어 문장이 여러 덱에 있을 수 있다(요청 단어가 주제별 문장과 겹치는 경우).
// 진도는 영어 문장 기준으로 저장되므로, "전체"에서는 한 번만 출제해 가중치가 두 배로
// 걸리지 않게 한다. 해설이 붙은 쪽을 남긴다. 개별 덱은 원본 그대로 유지.
const ALL_CARDS = (() => {
  const pick = new Map();
  for (const c of CARDS){
    const prev = pick.get(c.en);
    if (!prev || (!prev.note && c.note)) pick.set(c.en, c);
  }
  return [...pick.values()];
})();

function deckCards(){
  return state.deck === "all" ? ALL_CARDS : CARDS.filter(c => c.cat === state.deck);
}

// Level 0 (틀림) → 5 (숙달). 최고:최저 ≈ 2.4:1 — 약한 카드를 확실히 더 자주 보되,
// 덱이 400장으로 커져도 외운 카드가 사라지지 않도록 완만하게 둔다.
const LEVEL_WEIGHT = [2.2, 1.9, 1.6, 1.35, 1.1, 0.9];

function weightOf(card){
  if (!state.weighted) return 1;
  const st = rec(card);
  let w = LEVEL_WEIGHT[Math.min(5, Math.max(0, st.lvl))];
  if (st.r + st.w === 0) w *= 1.2;          // 아직 안 본 카드 살짝 우대
  return w;
}

function pick(){
  const pool = deckCards();
  if (!pool.length) return null;
  const avoid = new Set(recent.slice(-Math.min(6, Math.max(0, pool.length - 1))));
  let cands = pool.filter(c => !avoid.has(c.en));
  if (!cands.length) cands = pool;

  const weights = cands.map(weightOf);
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < cands.length; i++){
    r -= weights[i];
    if (r <= 0) return cands[i];
  }
  return cands[cands.length - 1];
}

/* ------------------------------------------------------------------
   SPEECH
------------------------------------------------------------------ */
let voices = [];
function refreshVoices(){ try { voices = window.speechSynthesis.getVoices() || []; } catch { voices = []; } }
if ("speechSynthesis" in window){
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}
function pickVoice(){
  if (!voices.length) refreshVoices();
  const en = voices.filter(v => /^en\b|^en[-_]/i.test(v.lang));
  if (!en.length) return null;
  const preferred = ["Samantha","Google US English","Microsoft Aria","Microsoft Jenny","Microsoft Michelle","Ava","Allison","Alex","Google UK English Female"];
  for (const name of preferred){
    const hit = en.find(v => v.name.indexOf(name) !== -1);
    if (hit) return hit;
  }
  return en.find(v => /en[-_]US/i.test(v.lang)) || en[0];
}
function speak(text){
  if (!("speechSynthesis" in window)){
    toast("이 브라우저는 음성 재생을 지원하지 않습니다");
    return;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice();
  if (v){ u.voice = v; u.lang = v.lang; } else { u.lang = "en-US"; }
  u.rate = state.rate;
  u.pitch = 1;
  u.onstart = () => el.play.classList.add("is-speaking");
  u.onend = u.onerror = () => el.play.classList.remove("is-speaking");
  window.speechSynthesis.speak(u);
}

/* ------------------------------------------------------------------
   DOM
------------------------------------------------------------------ */
const el = {
  decks: document.getElementById("decks"),
  card: document.getElementById("card"),
  tag: document.getElementById("tag"),
  ko: document.getElementById("ko"),
  en: document.getElementById("en"),
  note: document.getElementById("note"),
  play: document.getElementById("play"),
  rate: document.getElementById("rate"),
  again: document.getElementById("btnAgain"),
  got: document.getElementById("btnGot"),
  counter: document.getElementById("counter"),
  mFill: document.getElementById("masteryFill"),
  mLabel: document.getElementById("masteryLabel"),
  mCount: document.getElementById("masteryCount"),
  scrim: document.getElementById("scrim"),
  toast: document.getElementById("toast")
};

let toastTimer = null;
function toast(msg){
  el.toast.textContent = msg;
  el.toast.classList.add("is-on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.toast.classList.remove("is-on"), 2200);
}

function buildDecks(){
  el.decks.innerHTML = "";
  DECKS.forEach(d => {
    const n = d.id === "all" ? ALL_CARDS.length : CARDS.filter(c => c.cat === d.id).length;
    const b = document.createElement("button");
    b.className = "chip";
    b.type = "button";
    b.setAttribute("aria-pressed", String(state.deck === d.id));
    b.innerHTML = d.name + '<span class="n">' + n + "</span>";
    b.addEventListener("click", () => {
      state.deck = d.id;
      recent = [];
      save();
      buildDecks();
      next();
      updateMastery();
    });
    el.decks.appendChild(b);
  });
}

function updateCounter(){
  const acc = session.seen ? Math.round(session.right / session.seen * 100) + "%" : "—";
  el.counter.innerHTML = "<b>" + session.seen + "</b>장 · 정답률 <b>" + acc + "</b>";
}

function updateMastery(){
  const pool = deckCards();
  const mastered = pool.filter(c => rec(c).lvl >= 4).length;
  const pct = pool.length ? Math.round(mastered / pool.length * 100) : 0;
  el.mFill.style.width = pct + "%";
  el.mLabel.textContent = "숙달 " + pct + "%";
  el.mCount.textContent = mastered + "/" + pool.length;
}

function render(){
  if (!current) return;
  const st = rec(current);
  const front = state.koFirst ? current.ko : current.en;
  const back  = state.koFirst ? current.en : current.ko;

  el.ko.textContent = front;
  el.en.textContent = back;
  el.ko.style.fontFamily = state.koFirst ? "" : '"Literata", Georgia, serif';
  el.en.style.fontFamily = state.koFirst ? "" : '"IBM Plex Sans KR", system-ui, sans-serif';

  if (current.note){ el.note.textContent = current.note; el.note.hidden = false; }
  else { el.note.hidden = true; }

  const lvlDots = "●".repeat(st.lvl) + "○".repeat(5 - st.lvl);
  el.tag.innerHTML = DECK_NAME[current.cat] + '<span class="dot"></span><span class="lvl">' + lvlDots + "</span>";
  el.card.style.setProperty("--lvl", (st.lvl / 5 * 100) + "%");
}

function next(){
  const c = pick();
  if (!c){ el.ko.textContent = "이 덱에 카드가 없습니다."; return; }
  current = c;
  revealed = false;
  el.card.classList.remove("is-open");
  el.again.disabled = true;
  el.got.disabled = true;
  el.card.setAttribute("aria-label", "탭하면 정답이 보입니다");
  render();
}

function reveal(){
  if (revealed || !current) return;
  revealed = true;
  el.card.classList.add("is-open");
  el.again.disabled = false;
  el.got.disabled = false;
  el.card.setAttribute("aria-label", "정답이 표시되었습니다");
  if (state.autoPlay) speak(state.koFirst ? current.en : current.en);
}

function answer(correct){
  if (!current) return;
  if (!revealed){ reveal(); return; }
  const st = rec(current);
  const updated = correct
    ? { lvl: Math.min(5, st.lvl + 1), r: st.r + 1, w: st.w }
    : { lvl: Math.max(0, st.lvl - 2), r: st.r, w: st.w + 1 };
  state.progress[current.en] = updated;
  session.seen++;
  if (correct) session.right++;
  recent.push(current.en);
  if (recent.length > 30) recent.shift();
  save();
  updateCounter();
  updateMastery();
  try { window.speechSynthesis.cancel(); } catch {}
  next();
}

/* ---- events ---- */
el.card.addEventListener("click", reveal);
el.card.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " "){ e.preventDefault(); reveal(); }
});
el.play.addEventListener("click", e => {
  e.stopPropagation();
  if (current) speak(current.en);
});
el.rate.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  e.stopPropagation();
  state.rate = parseFloat(b.dataset.rate);
  save();
  [...el.rate.querySelectorAll("button")].forEach(x =>
    x.setAttribute("aria-pressed", String(x === b))
  );
  if (current && revealed) speak(current.en);
});
el.again.addEventListener("click", () => answer(false));
el.got.addEventListener("click", () => answer(true));

document.addEventListener("keydown", e => {
  if (el.scrim.classList.contains("is-open")){
    if (e.key === "Escape") closeSheet();
    return;
  }
  if (e.target.closest("button")) return;
  if (e.key === " "){ e.preventDefault(); revealed ? answer(true) : reveal(); }
  else if (e.key === "1"){ answer(false); }
  else if (e.key === "2"){ answer(true); }
  else if (e.key.toLowerCase() === "p" && current){ speak(current.en); }
});

/* ---- settings sheet ---- */
const toggles = {
  tAuto:   { get: () => state.autoPlay, set: v => state.autoPlay = v },
  tWeight: { get: () => state.weighted, set: v => state.weighted = v },
  tDir:    { get: () => state.koFirst,  set: v => state.koFirst = v }
};
function syncToggles(){
  Object.entries(toggles).forEach(([id, t]) =>
    document.getElementById(id).setAttribute("aria-pressed", String(t.get()))
  );
}
Object.entries(toggles).forEach(([id, t]) => {
  document.getElementById(id).addEventListener("click", () => {
    t.set(!t.get());
    save();
    syncToggles();
    if (id === "tDir") next();
  });
});
function openSheet(){ el.scrim.classList.add("is-open"); }
function closeSheet(){ el.scrim.classList.remove("is-open"); }
document.getElementById("openSettings").addEventListener("click", openSheet);
document.getElementById("btnClose").addEventListener("click", closeSheet);
el.scrim.addEventListener("click", e => { if (e.target === el.scrim) closeSheet(); });
document.getElementById("btnReset").addEventListener("click", () => {
  state.progress = {};
  session = { seen: 0, right: 0 };
  recent = [];
  save();
  updateCounter();
  updateMastery();
  next();
  closeSheet();
  toast("학습 기록을 초기화했습니다");
});

/* ---- boot ---- */
[...el.rate.querySelectorAll("button")].forEach(b =>
  b.setAttribute("aria-pressed", String(parseFloat(b.dataset.rate) === state.rate))
);
buildDecks();
syncToggles();
updateCounter();
updateMastery();
next();
</script>
</body>
